[package]
name = "payme-qr"
version = "0.1.0"
edition = "2021"
description = "Offline generator of PayMe payment links and QR codes (SBA Payment Link Standard 2.0)"

[lib]
name = "payme_qr"
path = "src/lib.rs"

[[bin]]
name = "payme-qr"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"
anyhow = "1"

[dev-dependencies]
image = "0.25"
rqrr = "0.11"
